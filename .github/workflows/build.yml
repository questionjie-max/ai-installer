name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build macOS (arm64)
        run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Installer-mac-arm64
          path: dist/AI-Installer-*-mac-arm64.dmg
          if-no-files-found: warn

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Windows (x64)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Installer-win
          path: dist/AI-Installer-*-win-x64.exe
          if-no-files-found: warn

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: List artifacts
        run: ls -laR
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AI Tool Installer v1.0.0
          body: |
            ## 🔧 AI Tool Installer v1.0.0

            ### 🖥️ macOS (Apple Silicon)
            Download `AI-Installer-mac-arm64.dmg`

            ### 🪟 Windows
            Download `AI-Installer-win-x64.exe`

            ### ✨ 支持安装的产品
            Claude Code · Codex CLI · OpenCode · DeepSeek TUI · Kimi Code · Qoder CLI
            OpenClaw · Hermes Agent · Cursor · Windsurf · Trae · Qoder Desktop · VS Code · CC Switch
          generate_release_notes: false
          make_latest: true
          files: |
            AI-Installer-mac-arm64/*.dmg
            AI-Installer-win/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
